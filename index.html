<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>像素地形瓦片集 · 程序化过渡 · 多地图查看器</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<header>
  <h1>像素地形瓦片集<small>程序化生成 · 完整过渡瓦片 · 高低地形 · 多地图</small></h1>
  <div class="controls" id="mapbar"></div>
  <div class="controls">
    <span id="seedinfo"></span>
    <label class="seedbox" title="当前种子号，可直接输入数字回车加载该种子地图">种子 <input type="number" id="seedInput" min="0" max="65535" step="1" inputmode="numeric" aria-label="种子号"></label>
    <button class="btn" id="btnReroll" title="换一个随机种子，重新生成当前地图">换种子</button>
    <button class="btn" id="btnFit">适应窗口</button>
    <label class="chk">缩放 <input type="range" id="zoom" min="0.5" max="4" step="0.1" value="1"> <span id="zoomval">1.0</span></label>
    <label class="chk"><input type="checkbox" id="grid"> 网格</label>
    <label class="chk"><input type="checkbox" id="tint" title="按高度对地形做 hypsometric 海拔着色（低蓝高白）"> 海拔着色</label>
    <label class="chk"><input type="checkbox" id="contour" title="固定高度阈值处画 1px 等高线"> 等高线</label>
    <label class="chk"><input type="checkbox" id="animate" checked> 水/岩浆动画</label>
    <label class="chk">速度 <input type="range" id="speed" min="0" max="3" step="0.1" value="1"></label>
  </div>
</header>
<div id="main">
  <div id="mapwrap"><canvas id="cv" width="16" height="16" role="img" aria-label="地图加载中…"></canvas></div>
  <aside id="palette"></aside>
</div>
<noscript>此页面需要启用 JavaScript。</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
